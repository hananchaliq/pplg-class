<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="uCoreGrad" cx="30%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#e88d3f" />
      <stop offset="50%" stop-color="#b84a27" />
      <stop offset="100%" stop-color="#58190e" />
    </radialGradient>
    <linearGradient id="uGoldRing" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffebb8" />
      <stop offset="50%" stop-color="#e2a850" />
      <stop offset="100%" stop-color="#965618" />
    </linearGradient>
    <linearGradient id="uLetterGrad" x1="20" y1="16" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fff4df" />
      <stop offset="100%" stop-color="#f7d294" />
    </linearGradient>
  </defs>

  <!-- Lingkaran Utama Bulat Penuh (Unity of XII PPLG 1) -->
  <circle cx="32" cy="32" r="30.5" fill="url(#uCoreGrad)" stroke="url(#uGoldRing)" stroke-width="3" />

  <!-- Cincin Tenun Ikat Ende di Bagian Dalam -->
  <circle cx="32" cy="32" r="25.5" stroke="#fce0a6" stroke-width="1.2" stroke-dasharray="3 2.5" opacity="0.7" />

  <!-- 3 Bintang/Berlian Puncak: 3 Danau Kelimutu & 3 Tahun Perjalanan (X, XI, XII) -->
  <polygon points="32,7.5 34.2,11 32,14.5 29.8,11" fill="#ffe8b3" />
  <circle cx="23.5" cy="12" r="1.8" fill="#f7ce7e" />
  <circle cx="40.5" cy="12" r="1.8" fill="#f7ce7e" />

  <!-- Monogram Huruf "U" Berwibawa di Tengah -->
  <path
    d="M19 20 H27.5 V22.5 H25.8 V34.5 C25.8 39.2 28.2 41.8 32 41.8 C35.8 41.8 38.2 39.2 38.2 34.5 V22.5 H36.5 V20 H45 V22.5 H43.2 V34.8 C43.2 42.2 38.8 46.5 32 46.5 C25.2 46.5 20.8 42.2 20.8 34.8 V22.5 H19 V20 Z"
    fill="url(#uLetterGrad)"
  />

  <!-- Simbol Node Kode PPLG & Berlian Persaudaraan di Bawah Huruf U -->
  <path d="M23 50.5 L20 52.5 L23 54.5" stroke="#ffdca0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="32,50.3 34.3,52.5 32,54.7 29.7,52.5" fill="#ffdca0" />
  <path d="M41 50.5 L44 52.5 L41 54.5" stroke="#ffdca0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
